apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
    environment: dev
    team: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        environment: dev
        team: devops
    spec:
      containers:
        - name: nginx
          image: docker.io/wajdibestlab/nginx-unsigned-test:1
          ports:
            - containerPort: 80