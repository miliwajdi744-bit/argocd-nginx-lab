apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
    environment: dev
    team: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        environment: dev
        team: devops
    spec:
      containers:
        - name: nginx
          image: docker.io/wajdibestlab/nginx-signed-test@sha256:0ee3ad542a77edbf8bd220a6ad7a080134eac7b2bb123c4d4b19e06e50a1fc94
          ports:
            - containerPort: 80